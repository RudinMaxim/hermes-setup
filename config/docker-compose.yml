# config/docker-compose.yml
# Run from the repo root: docker compose -f config/docker-compose.yml up -d

services:
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    container_name: hermes
    restart: unless-stopped
    env_file: ./.env
    # Pin HERMES_HOME so the data volume below is mounted exactly where Hermes
    # stores its state (config.yaml, state.db, sessions, mcp-tokens, SOUL.md).
    # This image defaults HERMES_HOME=/opt/data; older layouts used
    # /home/hermes/.hermes. If you change this, change the volume target too.
    environment:
      HERMES_HOME: /opt/data
    volumes:
      - hermes_data:/opt/data
      - ${HERMES_PROJECTS_DIR:-/home/hermes/projects}:/home/hermes/projects
    networks: [hermes_net]
    healthcheck:
      test: ["CMD-SHELL", "hermes --version >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stdin_open: true
    tty: true

# Both the volume and the network are created by scripts/setup-hermes.sh
# (ensure_volume / ensure_network) so they can be shared with the MCP compose
# file. Declared external here so compose attaches instead of trying to own
# them — otherwise compose errors with "network exists but was not created by
# compose".
volumes:
  hermes_data:
    external: true
    name: hermes_data

networks:
  hermes_net:
    external: true
    name: hermes_net
